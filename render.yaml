services:
  # ─── Backend: FastAPI (Docker) ─────────────────────────────────────────────
  - type: web
    name: nukus-bus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/nukus_bus.db
      - key: PORT
        value: 8000
    disk:
      name: nukus-bus-data
      mountPath: /data
      sizeGB: 1

  # ─── Frontend: Static Site ─────────────────────────────────────────────────
  - type: web
    name: nukus-bus
    runtime: static
    staticPublishPath: ./frontend
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
