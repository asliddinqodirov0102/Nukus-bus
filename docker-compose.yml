version: "3.9"

services:

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: nukus_bus_api
    restart: unless-stopped
    environment:
      - JWT_SECRET=nukus-bus-production-secret-change-me
      - PORT=8000
    volumes:
      # SQLite ma'lumotlar bazasini persisten saqlash
      - bus_data:/data
      # Frontend statik fayllarni backend konteyneriga ulash
      - ./frontend:/app/frontend:ro
    networks:
      - busnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nukus_bus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - busnet

volumes:
  bus_data:

networks:
  busnet:
    driver: bridge
